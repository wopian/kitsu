telemetry = false

[install]
minimumReleaseAge = 259200

[test]
isolate = true
pathIgnorePatterns = [".cache/**", "node_modules/**", "**/dist/**", "release-artifacts/**"]
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
coverageThreshold = { lines = 1.0, functions = 1.0 }
coverageSkipTestFiles = true
coveragePathIgnorePatterns = ["specification/**", "scripts/**", "packages/benchmark/**", "release.config.ts", "**/dist/**", "**/types/**", ".cache/**"]
