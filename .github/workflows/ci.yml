name: CI
on:
  push:
    branches-ignore:
      - master
  pull_request:
  merge_group:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun dedupe --check
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format
      - run: bun test --check --coverage --reporter=junit --reporter-outfile=coverage/junit.xml
      - run: bun run test:compatibility
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ runner.os }}
          path: coverage/
          if-no-files-found: error
  packages:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run docs
      - run: bun run build
      - run: bun run size
      - run: bun run test:packages
      - uses: actions/upload-artifact@v7
        with:
          name: esm-packages
          path: .cache/package-smoke/*.tgz
          include-hidden-files: true
          if-no-files-found: error
  compatibility:
    needs: packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: esm-packages
          path: .cache/esm-packages
      - run: bun run test:packages .cache/esm-packages
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: node .cache/package-smoke/consumer/smoke.mjs
